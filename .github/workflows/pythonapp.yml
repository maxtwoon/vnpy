name: Python application

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-toolchain.txt
          python -m pip install -c requirements-toolchain.txt -e ".[alpha,dev]" types-tqdm

      - name: Lint
        run: |
          ruff check vnpy tests tools/handoff.py tools/sync_check.py

      - name: Type check
        run: mypy vnpy

      - name: Build
        run: uv build

      - name: sync_check (root)
        run: python tools/sync_check.py

