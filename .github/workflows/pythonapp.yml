name: Python application

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy uv types-tqdm
          uv pip install ta-lib==0.6.4 --index=https://pypi.vnpy.com --system
          uv pip install -e .[alpha,dev] --system
          uv pip install -r examples/czsc_strategy/requirements.txt --system

      - name: Lint
        run: |
          ruff check vnpy tests tools/handoff.py tools/sync_check.py
          ruff check examples/czsc_strategy/diagnostics/simnow_20d_aggregate.py examples/czsc_strategy/diagnostics/simnow_promotion_decision.py
          ruff check examples/czsc_strategy/tests/unit/test_simnow_20d_aggregate.py examples/czsc_strategy/tests/unit/test_simnow_promotion_parity.py examples/czsc_strategy/tests/unit/test_simnow_ledger_summary.py examples/czsc_strategy/tests/unit/test_repo_hygiene.py

      - name: Type check
        run: mypy vnpy

      - name: Build
        run: uv build

      - name: sync_check (root)
        run: python tools/sync_check.py

      - name: sync_check (czsc_strategy)
        run: python tools/sync_check.py --root examples/czsc_strategy

      - name: pytest (czsc_strategy unit, not realdb)
        run: python -m pytest examples/czsc_strategy/tests/unit -q -m "not realdb"
