version_source: vnpy/__init__.py::__version__

must_match:
  - HANDOFF.md

changelog:
  file: CHANGELOG.md

doc_index: docs/index.rst

archive_dir: docs/archive/
archive_must_not_be_in_root:
  - docs/*_CODE_AGENT*.md
  - docs/*_DEPRECATED*.md

allow_history_notes: true

deliverables_policy:
  require_new_evidence_on_dev_to_review: true
  # When the stage transition is dev -> review, sync_check additionally requires
  # that at least one deliverable listed in HANDOFF.md's front matter has a git
  # commit newer than the preceding design->dev transition (i.e. dev actually
  # touched/added something tracked). Diagnostics evidence under a git-ignored
  # directory must appear in `git show --stat` for a dev-stage commit (i.e. was
  # `git add -f`'d), not merely exist on disk untracked.

project_version_freshness:
  project_root: examples/czsc_strategy
  config_file: chan_strategy/config.py
  watch_variables: [STRATEGY_CONFIG, BACKTEST_CONFIG]
  version_file: VERSION
  changelog_file: CHANGELOG.md
  # gate_since is implicit: the commit that introduced this block into .synccheck.yml.
  # Only commits after that point are checked, so older A52-A54 changes are not retroactively punished.

diagnostics_banner_check:
  dirs:
    - examples/czsc_strategy/diagnostics
  banner: "<!-- RESEARCH-ONLY / NOT PROMOTION EVIDENCE -->"
  skip:
    - WORK_LOG.md
    - ACCEPTANCE.md
    - AUTOMATION_PROMPT.md
    - NEXT_WORK.md
    - simnow_daily_observation_workflow.md
    - simnow_connection_probe.md
    - audit_issue_diagnostics_*.md
  exempt_dirs:
    # Archived historical HANDOFF snapshots, not live research/diagnostic reports.
    - examples/czsc_strategy/diagnostics/archive

handoff:
  file: HANDOFF.md
  stages: [design, dev, review, done]
  # 2026-09-16 role assignment (TASKS.md / HANDOFF.md ETF-20260916): Codex owns
  # design/coordination only; Kimi CLI (jointly with OpenCode) owns dev; real
  # Claude Code owns independent review. Commands follow the local CLIs
  # verified on this machine: `opencode run`, `kimi -p`, `claude -p`,
  # `codex exec` (see TASKS.md coordination record 2026-09-16).
  owners:
    design: codex
    dev: kimi-code
    review: claude-code
  no_auto_advance: [review]   # review must explicitly next/reject; pipeline run loop must not
                              # silently treat "agent exited 0 without transitioning" as accept
  commands:
    design: codex exec "Read HANDOFF.md and AGENTS.md, finish the design stage, then run python tools/handoff.py next"
    # NOTE (2026-09-16): kimi-cli headless mode is `-p/--prompt` alone. The
    # combination `kimi --auto -p` was tried on this machine and fails with
    # "Cannot combine --prompt with --auto" (recorded in TASKS.md and
    # coordination_update_02.md); do not reintroduce it. If a future kimi-cli
    # changes flags again, re-verify with `kimi --help` before editing here.
    dev: kimi -p "Read HANDOFF.md and AGENTS.md, finish the dev stage, then run python tools/handoff.py next"
    # NOTE (2026-09-16): review moved from `codex exec` (with its Windows
    # sandbox add-dirs) to real Claude Code (`claude -p`). The historical
    # 2026-07-11 codex-sandbox symlink/tmp_path notes applied to the old
    # reviewer only and are retired with it. If a review round hits the same
    # tmp_path/WinError 5 signature, check for a Manual verification block in
    # the current task file before blaming the code.
    review: claude -p "Read HANDOFF.md and AGENTS.md, review against the handoff acceptance criteria, then run python tools/handoff.py next or python tools/handoff.py reject."
