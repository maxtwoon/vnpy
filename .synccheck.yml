version_source: vnpy/__init__.py::__version__

must_match:
  - HANDOFF.md

changelog:
  file: CHANGELOG.md

doc_index: docs/index.rst

archive_dir: docs/archive/
archive_must_not_be_in_root:
  - docs/*_CODE_AGENT*.md
  - docs/*_DEPRECATED*.md

allow_history_notes: true

handoff:
  file: HANDOFF.md
  stages: [design, dev, review, done]
  owners:
    design: claude-code
    dev: kimi-code
    review: codex
  commands:
    design: claude -p "Read HANDOFF.md and AGENTS.md, finish the design stage, then run python tools/handoff.py next"
    # NOTE (2026-07-10): plain `kimi -p "..."` is NOT headless — `-p`/`--prompt` only seeds the
    # first message; kimi still waits for interactive tool-call confirmation. With no TTY in the
    # subprocess (handoff.py run spawns via subprocess.Popen), confirmations can never arrive, so
    # kimi silently made zero edits across 6 straight A39 dev rounds and just called `handoff.py
    # next` per the literal prompt text. `--print` is the actual non-interactive mode and
    # implicitly enables `--yolo` (auto-approve); `--yolo` is kept explicit here for robustness
    # against that implicit behavior changing in a future kimi-cli version. Verified empirically:
    # `kimi -p "create a file"` created nothing; `kimi --print --yolo -p "create a file"` did.
    dev: kimi --print --yolo -p "Read HANDOFF.md and AGENTS.md, finish the dev stage, then run python tools/handoff.py next"
    # NOTE (2026-07-11): codex exec's default filesystem sandbox is "restricted" (codex doctor)
    # and only grants write access inside the repo workspace. Two straight A39 review rounds
    # showed the SAME symptoms: pytest collection/tmp_path errors and a vnpy logger
    # PermissionError writing C:\Users\Admin\.vntrader\log\vt_*.log — i.e. the acceptance test
    # suite needs to write outside the repo (vnpy's trader runtime dir + pytest's OS temp root),
    # which the sandbox silently denies (surfaces as test errors, not an obvious crash). Verified
    # empirically: writing to .vntrader was denied without --add-dir, and succeeded with it.
    # --add-dir grants exactly the extra write access needed without disabling the sandbox.
    review: codex exec --add-dir "C:\Users\Admin\.vntrader" --add-dir "C:\Users\Admin\AppData\Local\Temp" "Read HANDOFF.md and AGENTS.md, review against the handoff acceptance criteria, then run python tools/handoff.py next or python tools/handoff.py reject"
