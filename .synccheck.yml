version_source: vnpy/__init__.py::__version__

must_match:
  - HANDOFF.md

changelog:
  file: CHANGELOG.md

doc_index: docs/index.rst

archive_dir: docs/archive/
archive_must_not_be_in_root:
  - docs/*_CODE_AGENT*.md
  - docs/*_DEPRECATED*.md

allow_history_notes: true

deliverables_policy:
  require_new_evidence_on_dev_to_review: true
  # When the stage transition is dev -> review, sync_check additionally requires
  # that at least one deliverable listed in HANDOFF.md's front matter has a git
  # commit newer than the preceding design->dev transition (i.e. dev actually
  # touched/added something tracked). Diagnostics evidence under a git-ignored
  # directory must appear in `git show --stat` for a dev-stage commit (i.e. was
  # `git add -f`'d), not merely exist on disk untracked.

project_version_freshness:
  project_root: examples/czsc_strategy
  config_file: chan_strategy/config.py
  watch_variables: [STRATEGY_CONFIG, BACKTEST_CONFIG]
  version_file: VERSION
  changelog_file: CHANGELOG.md
  # gate_since is implicit: the commit that introduced this block into .synccheck.yml.
  # Only commits after that point are checked, so older A52-A54 changes are not retroactively punished.

diagnostics_banner_check:
  dirs:
    - examples/czsc_strategy/diagnostics
  banner: "<!-- RESEARCH-ONLY / NOT PROMOTION EVIDENCE -->"
  skip:
    - WORK_LOG.md
    - ACCEPTANCE.md
    - AUTOMATION_PROMPT.md
    - NEXT_WORK.md
    - simnow_daily_observation_workflow.md
    - simnow_connection_probe.md
    - audit_issue_diagnostics_*.md
  exempt_dirs:
    # Archived historical HANDOFF snapshots, not live research/diagnostic reports.
    - examples/czsc_strategy/diagnostics/archive

handoff:
  file: HANDOFF.md
  stages: [design, dev, review, done]
  owners:
    design: claude-code
    dev: kimi-code
    review: codex
  no_auto_advance: [review]   # review must explicitly next/reject; pipeline run loop must not
                              # silently treat "agent exited 0 without transitioning" as accept
  commands:
    design: claude -p "Read HANDOFF.md and AGENTS.md, finish the design stage, then run python tools/handoff.py next"
    # NOTE (2026-07-10): plain `kimi -p "..."` is NOT headless — `-p`/`--prompt` only seeds the
    # first message; kimi still waits for interactive tool-call confirmation. With no TTY in the
    # subprocess (handoff.py run spawns via subprocess.Popen), confirmations can never arrive, so
    # kimi silently made zero edits across 6 straight A39 dev rounds and just called `handoff.py
    # next` per the literal prompt text. `--print` is the actual non-interactive mode and
    # implicitly enables `--yolo` (auto-approve); `--yolo` is kept explicit here for robustness
    # against that implicit behavior changing in a future kimi-cli version. Verified empirically:
    # `kimi -p "create a file"` created nothing; `kimi --print --yolo -p "create a file"` did.
    dev: kimi --print --yolo -p "Read HANDOFF.md and AGENTS.md, finish the dev stage, then run python tools/handoff.py next"
    # NOTE (2026-07-11): codex exec's default filesystem sandbox is "restricted" (codex doctor)
    # and only grants write access inside the repo workspace. Two straight A39 review rounds
    # showed the SAME symptoms: pytest collection/tmp_path errors and a vnpy logger
    # PermissionError writing C:\Users\Admin\.vntrader\log\vt_*.log — i.e. the acceptance test
    # suite needs to write outside the repo (vnpy's trader runtime dir + pytest's OS temp root),
    # which the sandbox silently denies (surfaces as test errors, not an obvious crash). Verified
    # empirically: writing to .vntrader was denied without --add-dir, and succeeded with it.
    # --add-dir grants exactly the extra write access needed without disabling the sandbox.
    #
    # NOTE (2026-07-11, STANDING until the operator relogs in / reboots): --add-dir did NOT fully
    # fix it. pytest's tmp_path fixture creates a "-current" convenience symlink for every temp
    # dir, and codex exec's sandbox token cannot create ANY Windows symlink regardless of
    # --add-dir (verified: `New-Item -ItemType SymbolicLink ...` -> "NewItemSymbolicLinkElevationRequired
    # : Administrator privilege required for this operation."), so pytest's own tmp_path SETUP
    # fails with PermissionError [WinError 5] scanning pytest-of-Admin, cascading into ~87 unit-test
    # errors and a SimNow-unit-test failure inside preflight -- unrelated to the actual code under
    # review every time this has been observed. Root cause: Windows only grants
    # SeCreateSymbolicLinkPrivilege to non-admins via Developer Mode, and that privilege is bound to
    # the LOGON SESSION token (set at logon time), not refreshed by launching a new process -- so
    # enabling Developer Mode (registry: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock
    # \AllowDevelopmentWithoutDevLicense=1, already set 2026-07-11) has NO effect until the operator
    # logs off/on or reboots. Until that happens: if EITHER the unit-test command
    # (`pytest examples/czsc_strategy/tests/unit -q -m "not realdb"`) OR the preflight command fails
    # with this specific symlink/tmp_path signature, do NOT treat it as a code defect and do NOT
    # block the handoff solely on it -- check HANDOFF.md's current task file for a "Manual
    # verification (symlink-privilege sandbox limitation)" block recorded by claude-code with the
    # actual pass/fail counts from an unsandboxed run, and rely on that block for those two specific
    # acceptance items instead of your own sandboxed re-run. Still verify everything else normally
    # (diffs, other gates, guardrails). Remove this whole note once relogin/reboot is confirmed and
    # a review round passes both commands cleanly inside the sandbox again.
    review: codex exec --add-dir "C:\Users\Admin\.vntrader" --add-dir "C:\Users\Admin\AppData\Local\Temp" "Read HANDOFF.md and AGENTS.md, review against the handoff acceptance criteria, then run python tools/handoff.py next or python tools/handoff.py reject. IMPORTANT - if the pytest unit-test command or the preflight command fails with a symlink-privilege / tmp_path PermissionError (WinError 5) signature, this is a documented sandbox environment limitation (see the NOTE above the review command in .synccheck.yml), not a code defect -- look for a Manual verification block in the current task file recorded by claude-code and use its recorded pass/fail counts for those two specific acceptance items instead of re-running them yourself; still verify everything else (diffs, other gates, guardrails) normally."
