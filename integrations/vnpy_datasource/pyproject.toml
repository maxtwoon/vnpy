[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vnpy_datasource"
version = "0.2.0"
description = "Local VeighNa bridge to the maintained dataSource registry"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
alpha = ["polars>=1.26"]
test = ["pytest>=8"]

[project.scripts]
vnpy-datasource = "vnpy_datasource.cli:main"

[tool.setuptools.packages.find]
include = ["vnpy_datasource*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
