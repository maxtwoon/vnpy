[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vnpy_researchstore"
version = "0.1.0.dev1"
description = "Immutable research data store and VeighNa recorder for personal quant research (pure storage core + native bridge)."
readme = "INTERFACES.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyarrow>=19",
    "duckdb>=1.0",
    "zstandard>=0.22",
]

[project.scripts]
qstore = "research_store.cli:main"
vnpy-recorder = "vnpy_researchstore.launcher:main"

[project.optional-dependencies]
dev = [
    "mypy",
    "build",
]

[tool.hatch.build.targets.wheel]
packages = ["research_store", "vnpy_researchstore"]

[tool.hatch.build.targets.sdist]
include = [
    "research_store",
    "vnpy_researchstore",
    "INTERFACES.md",
    "JOURNAL_INTERFACES.md",
    "RECORDING_INTERFACES.md",
    "NATIVE_INTERFACES.md",
    "RECORDER_INTERFACES.md",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py310"
output-format = "full"

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # pyflakes
    "UP",  # pyupgrade
    "W",  # pycodestyle warning
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["pyarrow.*", "duckdb"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
